[project]
name = "stft-denoise"
version = "0.1.0"
description = "CardioSpecNet frequency-domain denoiser for e-textile heart sounds"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.12",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "wandb>=0.17",
]

[project.optional-dependencies]
dev = []

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
